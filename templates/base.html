<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}K8s Skills - Kubernetes Learning Path{% endblock %}</title>
  <meta name="description" content="{% block description %}Learn Kubernetes, cloud-native architecture, and DevOps practices{% endblock %}">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    {% block page_header %}
    <h1><i class="fas fa-cube"></i> Page Title</h1>
    <p>Page description goes here</p>
    {% endblock %}
  </header>

  <main>
    {% block content %}
    <section class="content-section">
      <p>Content goes here</p>
    </section>
    {% endblock %}
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 K8s Skills Learning Path. All rights reserved.</p>
      <div class="social-links">
        <a href="https://github.com/ashish02510gh" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-github"></i> GitHub
        </a>
        <a href="https://www.linkedin.com/in/ashish02510/" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-linkedin"></i> LinkedIn
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
