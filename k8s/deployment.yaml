apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-skills-web
  labels:
    app: k8s-skills-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-skills-web
  template:
    metadata:
      labels:
        app: k8s-skills-web
    spec:
      containers:
        - name: web
          image: <YOUR_REGISTRY>/k8s-skills-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-skills-secrets
                  key: SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
